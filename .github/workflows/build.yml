name: Build

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-csharp:
    name: C# bindings build (CSharp/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Real GodotSharp compile of the addon's C# API surface, catching the
      # class of bug a native-only CI never exercises: CSharp/ is packaged
      # and shipped verbatim by the `package` job below without ever being
      # built by anything. A real user hit exactly this (CS0246:
      # PackedInt32Array, a type that only exists as a Variant.Type enum
      # value in GodotSharp, not an instantiable C# type) because nothing
      # here ever compiled it. Godot.NET.Sdk is the same MSBuild SDK the
      # Godot editor itself uses to build C# projects, fetched from NuGet
      # rather than requiring a full headless editor boot (which doesn't
      # reliably trigger solution generation/build without a display).
      - name: Build C# bindings
        run: |
          mkdir -p csharp-build-check
          cp -r addons/FoundationSteamworks/CSharp csharp-build-check/
          cat > csharp-build-check/FoundationSteamworksCSharpCheck.csproj <<'EOF'
          <Project Sdk="Godot.NET.Sdk/4.6.1">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <EnableDynamicLoading>true</EnableDynamicLoading>
            </PropertyGroup>
          </Project>
          EOF
          dotnet build csharp-build-check/FoundationSteamworksCSharpCheck.csproj

  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        config:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }

    name: Build / ${{ matrix.config.name }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Steamworks SDK is never committed to this repo — Valve's SDK license
      # prohibits redistributing the SDK source/headers/import libs. It's fetched
      # privately here from a dedicated, access-locked repo via a fine-scoped PAT
      # (Contents: read, scoped to that repo only). See addons/FoundationSteamworks/
      # include/SteamSDKGoesHere.md for the local-dev equivalent of this step.
      - name: Fetch Steamworks SDK
        env:
          GH_TOKEN: ${{ secrets.STEAM_SDK_FETCH_TOKEN }}
        shell: bash
        run: |
          gh release download v1.63.0 \
            --repo heathen-engineering/steamworks-sdk-vendor \
            --pattern "steamworks-sdk.zip" \
            --output steamworks-sdk.zip
          mkdir -p addons/FoundationSteamworks/include
          unzip -q steamworks-sdk.zip -d addons/FoundationSteamworks/include
          rm steamworks-sdk.zip

      - name: Install Ninja (Linux)
        if: matrix.config.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: matrix.config.os == 'macos-latest'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: matrix.config.os == 'windows-latest'
        run: choco upgrade ninja

      - name: Setup MSVC (Windows)
        if: matrix.config.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          cmake -S addons/FoundationSteamworks -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoundationSteamworks-${{ matrix.config.name }}-${{ matrix.build_type }}
          path: addons/FoundationSteamworks/bin/*
          if-no-files-found: error

  package:
    name: Package addon
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FoundationSteamworks-*
          path: artifacts
          merge-multiple: true

      - name: Assemble addon package
        run: |
          mkdir -p package/addons/FoundationSteamworks
          cp -r addons/FoundationSteamworks/CSharp package/addons/FoundationSteamworks/
          cp -r addons/FoundationSteamworks/src package/addons/FoundationSteamworks/
          cp -r addons/FoundationSteamworks/gate package/addons/FoundationSteamworks/
          # SDK itself is gitignored/fetched-in-CI (Valve license), but the
          # placeholder doc telling consumers where to put it must ship —
          # previously missing from the Asset Store package entirely.
          mkdir -p package/addons/FoundationSteamworks/include
          cp addons/FoundationSteamworks/include/SteamSDKGoesHere.md package/addons/FoundationSteamworks/include/
          cp addons/FoundationSteamworks/plugin.cfg package/addons/FoundationSteamworks/
          # Ships inert (.gdextension.available, not .gdextension) — Godot's boot-time
          # scan never auto-loads it; gate/extension_resolver_gate.gd renames it to the
          # real name once FoundationSteamworksEditorPlugin.gd confirms Godot-Game-Framework
          # is present. (Previously copied the real, unlocked filename here, which doesn't
          # exist in this repo at all — this step would have failed the first time it ran.)
          cp addons/FoundationSteamworks/FoundationSteamworks.gdextension.available package/addons/FoundationSteamworks/
          cp addons/FoundationSteamworks/extension.manifest.json package/addons/FoundationSteamworks/
          cp addons/FoundationSteamworks/FoundationAutoload.tscn package/addons/FoundationSteamworks/
          mkdir -p package/addons/FoundationSteamworks/bin
          cp artifacts/* package/addons/FoundationSteamworks/bin/
          cp README.md package/addons/FoundationSteamworks/
          cp LICENSE package/addons/FoundationSteamworks/
          cd package && zip -r ../FoundationSteamworks.zip addons

      - name: Upload packaged addon
        uses: actions/upload-artifact@v4
        with:
          name: FoundationSteamworks
          path: FoundationSteamworks.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FoundationSteamworks.zip
