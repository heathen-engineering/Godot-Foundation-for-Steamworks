[plugin]
name="Foundation for Steamworks"
description="Godot GDExtension providing a 1:1 wrapper of the Steamworks SDK plus strongly-typed artifact types (UserData, LobbyData, AchievementData, …). Foundation fully owns User, Achievements, Stats, Leaderboards, and App/Utilities (data + operations); every other system's data types live here too, with their operational convenience surface reserved for Toolkit for Steamworks. Includes a Steamworks settings dock (App ID, Achievements, Stats, Leaderboards, DLC) and a Generate Code button producing a type-safe SteamGame.gd wrapper + autoload, matching the scope Foundation fully owns. Open-source under Apache 2.0."
author="Heathen Group"
version="1.63.7"
script="editor/FoundationSteamworksEditorPlugin.gd"
